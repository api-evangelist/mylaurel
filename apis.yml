name: myLaurel
description: >-
  myLaurel is a New York-based healthcare company delivering acute and
  transitional care in patients' homes. Its hybrid model pairs hands-on clinical
  teams with virtual technology support to prevent unnecessary hospitalizations,
  free critical hospital bed space, improve patient outcomes, and lower the total
  cost of care for both health systems and health plans. Reported results include
  a 49% reduction in 30-day readmissions, an average 1.5-day length-of-stay
  reduction, a 97 Net Promoter Score, and 3:1+ ROI within 90 days. myLaurel is a
  portfolio company of GV (Google Ventures). This profile has been enriched from
  the company's public web surface; it currently exposes no public developer API.
